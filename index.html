<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>star moss</title>
<meta name="description" content="Drag to grow. Vines reach for light.">
<meta property="og:title" content="star moss">
<meta property="og:description" content="Drag to grow. Vines reach for light.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yurukusa.github.io/star-moss/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="star moss">
<meta name="twitter:description" content="Drag to grow. Vines reach for light.">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #060810; }
canvas { display: block; cursor: crosshair; }
#hint {
  position: fixed; left: 0; right: 0; bottom: 24px;
  text-align: center; color: rgba(255,255,255,0.12);
  font: 12px/1 "Helvetica Neue", sans-serif; letter-spacing: 0.3em;
  pointer-events: none; transition: opacity 3s;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to grow</div>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
let W, H;

function resize() { W = C.width = innerWidth; H = C.height = innerHeight; }
resize();
addEventListener('resize', resize);

const branches = [];
let hintShown = true;

// Each branch grows from a seed point, splitting and curling
function createBranch(x, y, angle, depth, hue) {
  return {
    points: [{ x, y }],
    angle,
    speed: 1.5 - depth * 0.15,
    curl: (Math.random() - 0.5) * 0.06,
    splitChance: 0.012 - depth * 0.001,
    depth,
    maxDepth: 5 + Math.floor(Math.random() * 3),
    hue,
    sat: 40 + Math.random() * 20,
    age: 0,
    maxAge: 150 + Math.random() * 200 - depth * 20,
    width: Math.max(0.3, 3 - depth * 0.4),
    alive: true,
    stars: [],
  };
}

function growBranch(b) {
  if (!b.alive) return;
  b.age++;

  if (b.age > b.maxAge) {
    b.alive = false;
    // Bloom a star at the tip
    const tip = b.points[b.points.length - 1];
    b.stars.push({
      x: tip.x, y: tip.y,
      size: 1 + Math.random() * 2.5,
      hue: b.hue + Math.random() * 40 - 20,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.02 + Math.random() * 0.03,
    });
    return;
  }

  const last = b.points[b.points.length - 1];

  // Subtle noise for organic feel
  const noiseVal = Math.sin(b.age * 0.1 + last.x * 0.01) * 0.02;
  b.angle += b.curl + noiseVal;

  // Gravity: slight upward tendency
  b.angle += ((-Math.PI / 2) - b.angle) * 0.001;

  const nx = last.x + Math.cos(b.angle) * b.speed;
  const ny = last.y + Math.sin(b.angle) * b.speed;
  b.points.push({ x: nx, y: ny });

  // Split
  if (b.depth < b.maxDepth && Math.random() < b.splitChance) {
    const splitAngle = b.angle + (Math.random() - 0.5) * 1.2;
    const child = createBranch(nx, ny, splitAngle, b.depth + 1, b.hue + Math.random() * 30 - 15);
    child.maxAge = b.maxAge * (0.5 + Math.random() * 0.3);
    branches.push(child);
  }
}

function drawBranch(b, t) {
  if (b.points.length < 2) return;

  // Draw the vine
  const totalAlpha = Math.min(b.age / 30, 1);

  for (let i = 1; i < b.points.length; i++) {
    const segProgress = i / b.points.length;
    const alpha = totalAlpha * (0.15 + segProgress * 0.25);
    const width = b.width * (1 - segProgress * 0.6);
    const hue = b.hue + segProgress * 20;

    ctx.strokeStyle = `hsla(${hue}, ${b.sat}%, 45%, ${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.points[i - 1].x, b.points[i - 1].y);
    ctx.lineTo(b.points[i].x, b.points[i].y);
    ctx.stroke();
  }

  // Draw stars at tips
  ctx.globalCompositeOperation = 'lighter';
  for (const s of b.stars) {
    s.twinkle += s.twinkleSpeed;
    const brightness = 0.4 + Math.sin(s.twinkle) * 0.3;
    const r = s.size * (0.8 + Math.sin(s.twinkle * 1.3) * 0.2);

    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4);
    grad.addColorStop(0, `hsla(${s.hue}, 60%, 80%, ${brightness})`);
    grad.addColorStop(0.3, `hsla(${s.hue}, 50%, 60%, ${brightness * 0.4})`);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    ctx.fillStyle = `hsla(${s.hue + 20}, 40%, 95%, ${brightness * 0.8})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function plantSeed(x, y) {
  if (hintShown) {
    document.getElementById('hint').style.opacity = '0';
    hintShown = false;
  }

  const count = 2 + Math.floor(Math.random() * 3);
  const baseHue = Math.random() * 360;
  for (let i = 0; i < count; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
    branches.push(createBranch(x, y, angle, 0, baseHue + i * 20));
  }
}

// Interaction
let isDown = false;
C.addEventListener('pointerdown', e => {
  isDown = true;
  plantSeed(e.clientX, e.clientY);
});
C.addEventListener('pointermove', e => {
  if (isDown && Math.random() < 0.15) {
    plantSeed(e.clientX, e.clientY);
  }
});
C.addEventListener('pointerup', () => isDown = false);
C.addEventListener('pointerleave', () => isDown = false);

let frame = 0;
function loop() {
  // Very slow fade
  ctx.fillStyle = 'rgba(6, 8, 16, 0.008)';
  ctx.fillRect(0, 0, W, H);

  frame++;

  for (const b of branches) {
    growBranch(b);
    drawBranch(b, frame);
  }

  // Clean up dead branches with no stars (fully faded)
  for (let i = branches.length - 1; i >= 0; i--) {
    if (!branches[i].alive && branches[i].age > branches[i].maxAge + 500) {
      if (branches[i].stars.length === 0) {
        branches.splice(i, 1);
      }
    }
  }

  // Limit total branches
  if (branches.length > 300) {
    branches.splice(0, branches.length - 300);
  }

  requestAnimationFrame(loop);
}

loop();

// Growth sound - soft rising tone when planting
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playGrowSound(hue) {
  if (!audioCtx) return;
  const freq = 150 + (hue / 360) * 200;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(freq * 2, audioCtx.currentTime + 0.6);

  gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

const origPlant = plantSeed;
plantSeed = function(x, y) {
  initAudio();
  origPlant(x, y);
  playGrowSound(Math.random() * 360);
};
</script>
</body>
</html>
