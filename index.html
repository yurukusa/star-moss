<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>star moss — revive the world tree</title>
<meta name="description" content="Plant star moss to revive the ancient world tree. Click to grow.">
<meta property="og:title" content="star moss — revive the world tree">
<meta property="og:description" content="Plant star moss to revive the ancient world tree.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yurukusa.github.io/star-moss/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="star moss">
<meta name="twitter:description" content="Plant star moss to revive the ancient world tree.">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #060810; }
canvas { display: block; cursor: crosshair; }
#ui {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 20px; pointer-events: none; z-index: 10;
}
#stats {
  color: rgba(255,255,255,0.5);
  font: 13px/1.6 "Helvetica Neue", sans-serif;
  letter-spacing: 0.05em;
}
#stats .count { font-size: 22px; color: rgba(255,255,255,0.7); }
#stats .label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3); }
#tree-info {
  text-align: right;
  color: rgba(255,255,255,0.5);
  font: 13px/1.6 "Helvetica Neue", sans-serif;
}
#tree-info .stage-name { font-size: 14px; color: rgba(255,255,255,0.6); }
#tree-bar-wrap {
  width: 120px; height: 4px; background: rgba(255,255,255,0.08);
  border-radius: 2px; margin-top: 6px; margin-left: auto;
}
#tree-bar {
  height: 100%; background: rgba(140,200,140,0.5);
  border-radius: 2px; transition: width 0.5s ease;
}
#milestone {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.8); font: 16px/1.6 "Helvetica Neue", sans-serif;
  text-align: center; pointer-events: none; opacity: 0; transition: opacity 1s;
  z-index: 20; text-shadow: 0 0 20px rgba(140,200,140,0.5);
}
#milestone .title { font-size: 20px; margin-bottom: 4px; }
#milestone .desc { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; }
#hint {
  position: fixed; left: 0; right: 0; bottom: 24px;
  text-align: center; color: rgba(255,255,255,0.12);
  font: 12px/1 "Helvetica Neue", sans-serif; letter-spacing: 0.3em;
  pointer-events: none; transition: opacity 3s;
}
#idle-msg {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.6); font: 14px/1.8 "Helvetica Neue", sans-serif;
  text-align: center; pointer-events: none; opacity: 0; z-index: 20;
  transition: opacity 2s;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="stats">
    <div class="count" id="mossCount">0</div>
    <div class="label">star moss</div>
  </div>
  <div id="tree-info">
    <div class="stage-name" id="treeName">dead stump</div>
    <div id="tree-bar-wrap"><div id="tree-bar" style="width:0%"></div></div>
  </div>
</div>

<div id="milestone"><div class="title"></div><div class="desc"></div></div>
<div id="hint">drag to grow</div>
<div id="idle-msg"></div>

<script>
// === GAME STATE ===
// Moss types unlock into the random pool — player doesn't choose, variety increases naturally
const UNLOCK_THRESHOLDS = [
  { at: 0,    name: 'seedling',   desc: 'The first moss.',               satRange: [35, 55] },
  { at: 50,   name: 'crystal',    desc: 'Cold light. Grows in silence.', satRange: [50, 70], speedMult: 0.8, curlMult: 0.15, sharpStars: true },
  { at: 200,  name: 'ember',      desc: 'A warm glow in the dark.',      satRange: [55, 75], speedMult: 0.7, widthMult: 1.8, splitMult: 2.5, maxAgeMult: 0.5, pulse: true },
  { at: 500,  name: 'aurora',     desc: 'Shifts through every color.',   satRange: [40, 60], rainbow: true, curlMult: 2.0, waveCurl: true },
  { at: 1500, name: 'starweaver', desc: 'Weaves constellations.',        satRange: [30, 50], bigStars: true, splitMult: 1.8, trailStars: true },
  { at: 3000, name: 'worldroot',  desc: 'The roots remember.',           satRange: [25, 45], speedMult: 1.4, widthMult: 2.0, depthMult: 1.5, gravityDown: true },
];

const TREE_STAGES = [
  { min: 0,    name: 'dead stump',      desc: '枯れた切り株',   trunkH: 0.08, branches: 0, leaves: 0,   glow: 0   },
  { min: 30,   name: 'first sprout',    desc: '最初の芽吹き',   trunkH: 0.12, branches: 2, leaves: 0,   glow: 0   },
  { min: 100,  name: 'young sapling',   desc: '若木',           trunkH: 0.22, branches: 5, leaves: 5,   glow: 0   },
  { min: 400,  name: 'growing tree',    desc: '成長する樹',     trunkH: 0.32, branches: 7, leaves: 15,  glow: 0.1 },
  { min: 1000, name: 'ancient tree',    desc: '古き樹',         trunkH: 0.45, branches: 10, leaves: 30, glow: 0.2 },
  { min: 2500, name: 'world tree',      desc: '世界樹',         trunkH: 0.55, branches: 14, leaves: 50, glow: 0.4 },
  { min: 5000, name: 'world tree ✦',    desc: '星の世界樹',     trunkH: 0.65, branches: 18, leaves: 80, glow: 0.7 },
];

// Auto-growth and click power upgrades
const UPGRADES = [
  { at: 20,   type: 'auto',  rate: 5000,  desc: '自動発芽 (5s)' },
  { at: 80,   type: 'click', power: 2,    desc: 'click ×2' },
  { at: 200,  type: 'auto',  rate: 3000,  desc: '自動発芽 (3s)' },
  { at: 500,  type: 'click', power: 3,    desc: 'click ×3' },
  { at: 1000, type: 'auto',  rate: 1500,  desc: '自動発芽 (1.5s)' },
  { at: 2000, type: 'click', power: 5,    desc: 'click ×5' },
  { at: 3500, type: 'auto',  rate: 800,   desc: '自動発芽 (0.8s)' },
  { at: 5000, type: 'click', power: 8,    desc: 'click ×8' },
];

let state = { totalMoss: 0, unlockedCount: 1, shownMilestones: [], lastTime: Date.now() };

function saveState() { state.lastTime = Date.now(); localStorage.setItem('star-moss-save', JSON.stringify(state)); }
function loadState() { try { Object.assign(state, JSON.parse(localStorage.getItem('star-moss-save') || '{}')); } catch(e) {} }

// === CANVAS ===
const C = document.getElementById('c');
const ctx = C.getContext('2d');
let W, H;
function resize() { W = C.width = innerWidth; H = C.height = innerHeight; }
resize();
addEventListener('resize', resize);

const branches = [];
let hintShown = true;

// === PICK RANDOM MOSS TYPE from unlocked pool ===
function pickMossType() {
  const unlocked = UNLOCK_THRESHOLDS.filter(u => state.totalMoss >= u.at);
  return unlocked[Math.floor(Math.random() * unlocked.length)];
}

// === WORLD TREE ===
function getTreeStage() {
  let s = TREE_STAGES[0];
  for (const t of TREE_STAGES) if (state.totalMoss >= t.min) s = t;
  return s;
}
function getTreeProgress() {
  const s = getTreeStage(); const i = TREE_STAGES.indexOf(s); const n = TREE_STAGES[i+1];
  return n ? (state.totalMoss - s.min) / (n.min - s.min) : 1;
}

function drawWorldTree() {
  const stage = getTreeStage();
  const cx = W / 2, groundY = H * 0.85;
  const trunkHeight = H * stage.trunkH, trunkWidth = 8 + stage.trunkH * 25;
  const trunkAlpha = 0.15 + stage.trunkH * 0.3;

  if (stage.glow > 0) {
    const r = trunkHeight * 1.5;
    const g = ctx.createRadialGradient(cx, groundY - trunkHeight*0.6, 0, cx, groundY - trunkHeight*0.6, r);
    g.addColorStop(0, `rgba(120,180,120,${stage.glow*0.08})`); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, groundY - trunkHeight*0.6, r, 0, Math.PI*2); ctx.fill();
  }

  // Trunk: curved, asymmetric (not a straight line)
  ctx.strokeStyle = `rgba(80,100,70,${trunkAlpha})`; ctx.lineWidth = trunkWidth; ctx.lineCap = 'round';
  const trunkLean = trunkHeight * 0.06;
  ctx.beginPath();
  ctx.moveTo(cx, groundY);
  ctx.bezierCurveTo(
    cx - trunkLean, groundY - trunkHeight * 0.3,
    cx + trunkLean * 1.5, groundY - trunkHeight * 0.6,
    cx + trunkLean * 0.5, groundY - trunkHeight
  );
  ctx.stroke();

  // Wide roots spreading outward
  ctx.lineWidth = trunkWidth * 0.5;
  const roots = [[-1.5, 0.7], [1.3, 0.8], [-0.6, 0.4], [0.8, 0.5], [-2.0, 0.3]];
  for (const [dir, len] of roots) {
    if (stage.trunkH < 0.15 && Math.abs(dir) > 1.5) continue;
    ctx.beginPath();
    ctx.moveTo(cx, groundY + 2);
    ctx.quadraticCurveTo(cx + dir * 25, groundY + 12, cx + dir * 50 * len, groundY + 4);
    ctx.stroke();
  }

  // Main fork: tree splits into 2-3 main limbs from ~60% height (not from top)
  const forkY = groundY - trunkHeight * 0.55;
  const forkX = cx + trunkLean * 0.8;
  ctx.lineWidth = Math.max(2, trunkWidth * 0.4);

  if (stage.branches >= 2) {
    // Left main limb
    ctx.beginPath(); ctx.moveTo(forkX, forkY);
    ctx.quadraticCurveTo(forkX - trunkHeight*0.15, forkY - trunkHeight*0.2, forkX - trunkHeight*0.25, forkY - trunkHeight*0.35);
    ctx.stroke();
    // Right main limb
    ctx.beginPath(); ctx.moveTo(forkX, forkY);
    ctx.quadraticCurveTo(forkX + trunkHeight*0.2, forkY - trunkHeight*0.15, forkX + trunkHeight*0.3, forkY - trunkHeight*0.3);
    ctx.stroke();
  }

  // Sub-branches from main limbs
  ctx.lineWidth = Math.max(1, trunkWidth * 0.2);
  for (let i = 2; i < stage.branches; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const t = 0.3 + (i / stage.branches) * 0.6;
    const limbLen = trunkHeight * 0.15 * (0.5 + t);
    const baseX = forkX + side * trunkHeight * 0.1 * t;
    const baseY = forkY - trunkHeight * t * 0.25;
    const angle = side * (0.8 + Math.sin(i * 7) * 0.4);
    const ex = baseX + Math.cos(angle - Math.PI/3) * limbLen;
    const ey = baseY + Math.sin(angle - Math.PI/3) * limbLen;
    ctx.beginPath(); ctx.moveTo(baseX, baseY);
    ctx.quadraticCurveTo(baseX + side * limbLen * 0.4, baseY - limbLen * 0.3, ex, ey);
    ctx.stroke();

    // Leaf clusters at branch tips
    if (stage.leaves > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const lc = Math.min(4, Math.ceil(stage.leaves / stage.branches));
      for (let j = 0; j < lc; j++) {
        const lx = ex + Math.sin(i*7+j*13)*12, ly = ey + Math.cos(i*11+j*17)*8;
        const lr = 4 + stage.glow * 10 + Math.sin(Date.now()*0.001+i+j)*2;
        const lh = 90 + Math.sin(i+j)*50;
        const gr = ctx.createRadialGradient(lx,ly,0,lx,ly,lr);
        gr.addColorStop(0, `hsla(${lh},45%,45%,${0.12+stage.glow*0.2})`); gr.addColorStop(1, 'transparent');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(lx,ly,lr,0,Math.PI*2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

// === BRANCHES (v1 logic preserved, enhanced by moss type) ===
function createBranch(x, y, angle, depth, hue, mossType) {
  const mt = mossType || UNLOCK_THRESHOLDS[0];
  const sMult = mt.speedMult || 1;
  const wMult = mt.widthMult || 1;
  const dMult = mt.depthMult || 1;
  const cMult = mt.curlMult || 1;

  const maxAgeMult = mt.maxAgeMult || 1;
  return {
    points: [{ x, y }],
    angle: mt.gravityDown ? Math.PI / 2 + (Math.random() - 0.5) * 0.8 : angle,
    speed: (1.5 - depth * 0.15) * sMult,
    curl: (Math.random() - 0.5) * 0.06 * cMult,
    splitChance: (mt.splitMult || 1) * (0.012 - depth * 0.001),
    depth,
    maxDepth: Math.floor((5 + Math.random() * 3) * dMult),
    hue,
    sat: mt.satRange[0] + Math.random() * (mt.satRange[1] - mt.satRange[0]),
    age: 0,
    maxAge: (150 + Math.random() * 200 - depth * 20) * maxAgeMult,
    width: Math.max(0.3, (3 - depth * 0.4) * wMult),
    alive: true,
    stars: [],
    rainbow: mt.rainbow || false,
    bigStars: mt.bigStars || false,
    sharpStars: mt.sharpStars || false,
    pulse: mt.pulse || false,
    waveCurl: mt.waveCurl || false,
    trailStars: mt.trailStars || false,
    gravityDown: mt.gravityDown || false,
  };
}

function growBranch(b) {
  if (!b.alive) return;
  b.age++;
  if (b.age > b.maxAge) {
    b.alive = false;
    const tip = b.points[b.points.length - 1];
    b.stars.push({
      x: tip.x, y: tip.y,
      size: b.bigStars ? (2 + Math.random() * 3) : (1 + Math.random() * 2.5),
      hue: b.hue + Math.random() * 40 - 20,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.02 + Math.random() * 0.03,
    });
    return;
  }
  const last = b.points[b.points.length - 1];
  const noiseAmt = b.waveCurl ? 0.06 : 0.02;
  b.angle += b.curl + Math.sin(b.age * 0.1 + last.x * 0.01) * noiseAmt;
  const gravTarget = b.gravityDown ? Math.PI / 2 : -Math.PI / 2;
  b.angle += (gravTarget - b.angle) * 0.001;

  // Trail stars: drop stars along the path (starweaver)
  if (b.trailStars && b.age % 20 === 0 && b.depth < 2) {
    b.stars.push({
      x: last.x, y: last.y,
      size: 0.8 + Math.random() * 1.2,
      hue: b.hue + Math.random() * 60 - 30,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.015 + Math.random() * 0.02,
    });
  }
  const nx = last.x + Math.cos(b.angle) * b.speed;
  const ny = last.y + Math.sin(b.angle) * b.speed;
  b.points.push({ x: nx, y: ny });

  if (b.depth < b.maxDepth && Math.random() < b.splitChance) {
    const child = createBranch(nx, ny, b.angle + (Math.random()-0.5)*1.2, b.depth+1, b.hue + Math.random()*30-15,
      { satRange: [b.sat-5, b.sat+5], rainbow: b.rainbow, bigStars: b.bigStars, sharpStars: b.sharpStars, pulse: b.pulse, waveCurl: b.waveCurl, trailStars: b.trailStars, gravityDown: b.gravityDown });
    child.maxAge = b.maxAge * (0.5 + Math.random() * 0.3);
    branches.push(child);
  }
}

function drawBranch(b) {
  if (b.points.length < 2) return;
  const totalAlpha = Math.min(b.age / 30, 1);
  for (let i = 1; i < b.points.length; i++) {
    const seg = i / b.points.length;
    let alpha = totalAlpha * (0.15 + seg * 0.25);
    let width = b.width * (1 - seg * 0.6);
    let hue = b.hue + seg * 20;
    // Pulse: ember type throbs
    if (b.pulse) {
      const pulseAmt = 0.3 * Math.sin(Date.now() * 0.005 + i * 0.3);
      alpha *= (1 + pulseAmt);
      width *= (1 + pulseAmt * 0.5);
    }
    if (b.rainbow) hue = (b.hue + seg * 120 + Date.now() * 0.01) % 360;
    ctx.strokeStyle = `hsla(${hue}, ${b.sat}%, 45%, ${alpha})`;
    ctx.lineWidth = width; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.points[i-1].x, b.points[i-1].y); ctx.lineTo(b.points[i].x, b.points[i].y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const s of b.stars) {
    s.twinkle += s.twinkleSpeed;
    const br = 0.4 + Math.sin(s.twinkle) * 0.3;
    const r = s.size * (0.8 + Math.sin(s.twinkle * 1.3) * 0.2);
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r*4);
    g.addColorStop(0, `hsla(${s.hue},60%,80%,${br})`); g.addColorStop(0.3, `hsla(${s.hue},50%,60%,${br*0.4})`); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, r*4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `hsla(${s.hue+20},40%,95%,${br*0.8})`;
    if (b.sharpStars) {
      // Cross/spike shape instead of circle
      ctx.lineWidth = 1;
      ctx.strokeStyle = `hsla(${s.hue},60%,90%,${br*0.6})`;
      ctx.beginPath(); ctx.moveTo(s.x, s.y - r*2); ctx.lineTo(s.x, s.y + r*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x - r*2, s.y); ctx.lineTo(s.x + r*2, s.y); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(s.x, s.y, r*0.5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// === CLICK POWER (scales with upgrades) ===
function getClickPower() {
  let power = 1;
  for (const u of UPGRADES) {
    if (u.type === 'click' && state.totalMoss >= u.at) power = u.power;
  }
  return power;
}

function getAutoRate() {
  let rate = 0;
  for (const u of UPGRADES) {
    if (u.type === 'auto' && state.totalMoss >= u.at) rate = u.rate;
  }
  return rate;
}

// === PLANTING (v1 style — fully random, enriched by unlocked pool) ===
function plantSeed(x, y) {
  if (hintShown) { document.getElementById('hint').style.opacity = '0'; hintShown = false; }

  const mossType = pickMossType();
  const power = getClickPower();
  const count = (2 + Math.floor(Math.random() * 3)) * power;
  const baseHue = Math.random() * 360;

  for (let i = 0; i < Math.min(count, 20); i++) {  // cap visual branches
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
    branches.push(createBranch(x, y, angle, 0, baseHue + i * (360/count), mossType));
  }

  state.totalMoss += count;
  checkUnlocks();
  updateUI();
  saveState();
}

// === AUTO-GROWTH (cookie clicker style) ===
let autoTimer = null;
function startAutoGrowth() {
  if (autoTimer) clearInterval(autoTimer);
  const rate = getAutoRate();
  if (rate > 0) {
    autoTimer = setInterval(() => {
      const x = Math.random() * W;
      const y = H * 0.3 + Math.random() * H * 0.5;
      const mossType = pickMossType();
      const baseHue = Math.random() * 360;
      const count = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        branches.push(createBranch(x, y, -Math.PI/2 + (Math.random()-0.5)*1.0, 0, baseHue + i*30, mossType));
      }
      state.totalMoss += count;
      updateUI();
      if (frame % 300 === 0) saveState();
    }, rate);
  }
}

// === INTERACTION (same as v1) ===
let isDown = false;
C.addEventListener('pointerdown', e => { isDown = true; plantSeed(e.clientX, e.clientY); });
C.addEventListener('pointermove', e => { if (isDown && Math.random() < 0.15) plantSeed(e.clientX, e.clientY); });
C.addEventListener('pointerup', () => isDown = false);
C.addEventListener('pointerleave', () => isDown = false);

// === UNLOCKS & MILESTONES ===
function checkUnlocks() {
  const newCount = UNLOCK_THRESHOLDS.filter(u => state.totalMoss >= u.at).length;
  if (newCount > state.unlockedCount) {
    const newest = UNLOCK_THRESHOLDS[newCount - 1];
    showMilestone(newest.name, newest.desc);
    state.unlockedCount = newCount;
  }
  // Check upgrade milestones
  for (const u of UPGRADES) {
    const key = 'up-' + u.at;
    if (state.totalMoss >= u.at && !state.shownMilestones.includes(key)) {
      state.shownMilestones.push(key);
      showMilestone(u.desc, u.type === 'auto' ? 'moss grows on its own now' : 'your touch grows stronger');
      startAutoGrowth(); // refresh auto rate
    }
  }
  const stage = getTreeStage();
  const key = 'tree-' + stage.name;
  if (!state.shownMilestones.includes(key) && state.totalMoss > 0 && stage.min > 0) {
    state.shownMilestones.push(key);
    showMilestone(stage.desc, 'the world tree grows');
  }
}

let milestoneTimeout = null;
function showMilestone(title, desc) {
  const el = document.getElementById('milestone');
  el.querySelector('.title').textContent = title;
  el.querySelector('.desc').textContent = desc;
  el.style.opacity = '1';
  clearTimeout(milestoneTimeout);
  milestoneTimeout = setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

// === UI ===
function updateUI() {
  document.getElementById('mossCount').textContent = state.totalMoss.toLocaleString();
  const stage = getTreeStage();
  document.getElementById('treeName').textContent = stage.desc || stage.name;
  document.getElementById('tree-bar').style.width = (getTreeProgress() * 100) + '%';
}

// === IDLE BONUS ===
function processIdleBonus() {
  const mins = Math.floor((Date.now() - state.lastTime) / 60000);
  if (mins >= 1) {
    const bonus = Math.min(mins, 480);
    state.totalMoss += bonus;
    checkUnlocks();
    const el = document.getElementById('idle-msg');
    el.textContent = `while you were away, ${bonus} moss grew quietly`;
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 4000);
  }
}

// === AUDIO (same as v1) ===
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playGrowSound(hue) {
  if (!audioCtx) return;
  const freq = 150 + (hue / 360) * 200;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(freq * 2, audioCtx.currentTime + 0.6);
  gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.6);
}
const origPlant = plantSeed;
plantSeed = function(x, y) { initAudio(); origPlant(x, y); playGrowSound(Math.random() * 360); };

// === MAIN LOOP ===
let frame = 0;
function loop() {
  ctx.fillStyle = 'rgba(6, 8, 16, 0.008)'; ctx.fillRect(0, 0, W, H);
  frame++;
  drawWorldTree();
  for (const b of branches) { growBranch(b); drawBranch(b); }
  for (let i = branches.length - 1; i >= 0; i--) {
    if (!branches[i].alive && branches[i].age > branches[i].maxAge + 500 && branches[i].stars.length === 0)
      branches.splice(i, 1);
  }
  if (branches.length > 400) branches.splice(0, branches.length - 400);
  if (frame % 1800 === 0) saveState();
  requestAnimationFrame(loop);
}

// === INIT ===
loadState();
processIdleBonus();
updateUI();
startAutoGrowth();
loop();
</script>
